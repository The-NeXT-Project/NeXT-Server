name: Build

on:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/next-server/default.pgo'
      - '.github/workflows/build.yml'
  # Dependabot and contributors.
  pull_request:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/next-server/default.pgo'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      extra_tags:
        description: 'Optional build tags added to the defaults, e.g. with_sentry,with_pprof'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: linux/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch:
          - amd64
          - arm64
          - riscv64
    env:
      CGO_ENABLED: 0
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
      TAGS: with_acme,with_utls,with_quic${{ inputs.extra_tags && format(',{0}', inputs.extra_tags) || '' }}
      # Every optional tag too, so that the code behind them is checked.
      ALL_TAGS: with_acme,with_utls,with_quic,with_sentry,with_pprof
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Vet
        run: |
          go vet -tags "$TAGS" ./...
          go vet -tags "$ALL_TAGS" ./...

      - name: Test
        if: matrix.goarch == 'amd64'
        run: |
          go test -tags "$TAGS" -timeout 300s ./...
          go test -tags "$ALL_TAGS" -timeout 300s ./...

      # Go applies it to the build below; every build must have it.
      - name: Check PGO profile
        run: test -s cmd/next-server/default.pgo || { echo "::error::cmd/next-server/default.pgo is missing, see README (Profiling)"; exit 1; }

      - name: Build
        run: |
          go build -v -trimpath \
            -tags "$TAGS" \
            -ldflags "-s -w -buildid= -X github.com/The-NeXT-Project/NeXT-Server/constant.Version=${GITHUB_SHA::7}" \
            -o dist/next-server \
            ./cmd/next-server

      - name: Upload test build
        uses: actions/upload-artifact@v7
        with:
          name: next-server-linux-${{ matrix.goarch }}
          path: dist/next-server
          retention-days: 14
          if-no-files-found: error
